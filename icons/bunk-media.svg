<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d3d3f"/><stop offset="1" stop-color="#161619"/></linearGradient></defs>
<style>
.g{fill:none;stroke:#fff;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.f{fill:#fff}
.ns{stroke:none}
