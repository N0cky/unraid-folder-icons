@keyframes glint{0%,84%,100%{opacity:.15}87%{opacity:.9}}
@keyframes spark{0%,83%,100%{opacity:0;transform:scale(.4)}87%{opacity:1;transform:scale(1.1)}95%{opacity:0;transform:scale(.8)}}
